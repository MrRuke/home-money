<app-card title="RECORDS.ADD_EVENT" [formGroup]="formGroup">
  <div
    class="form-group"
    [ngClass]="{ 'has-error': hasError('category') }"
  >
    <label class="control-label">
      {{ 'RECORDS.SELECT_CATEGORY' | translate }}
      <select
        class="form-control"
        formControlName="category"
      >
        <option value="0">{{ 'ACTIONS.SELECT' | translate }}</option>
        <option
          *ngFor="let category of categories"
          [value]="category.id"
        >
          {{ category.name }}
        </option>
      </select>
    </label>

    <div
      class="form-help-text"
      *ngIf="hasError('category')"
    >
      {{ 'ERRORS.REQUIRED' | translate }}
    </div>
  </div>

  <div
    class="form-group"
    [ngClass]="{ 'has-error': hasError('type') }"
  >
    <label class="control-label">
      {{ 'RECORDS.SELECT_TYPE' | translate }}
      <div>
        <label>
          <input
            class="radio"
            name="type"
            formControlName="type"
            type="radio"
            [value]="eventTypes.INCOME"
          >
          <span>{{ 'EVENTS.INCOME' | translate }}</span>
        </label>
      </div>

      <div>
        <label>
          <input
            class="radio"
            name="type"
            formControlName="type"
            type="radio"
            [value]="eventTypes.OUTCOME"
          >
          <span>{{ 'EVENTS.OUTCOME' | translate }}</span>
        </label>
      </div>
    </label>

    <div
      class="form-help-text"
      *ngIf="hasError('type')"
    >
      {{ 'ERRORS.REQUIRED' | translate }}
    </div>
  </div>

  <div
    class="form-group"
    [ngClass]="{ 'has-error': hasError('amount') }"
  >
    <label class="control-label">
      {{ 'RECORDS.ENTER_AMOUNT' | translate }}
      <input
        [title]="'RECORDS.ENTER_AMOUNT' | translate"
        type="number"
        formControlName="amount"
        class="form-control"
      />
    </label>

    <div
      class="form-help-text"
      *ngIf="hasError('amount')"
    >
      {{ 'ERRORS.REQUIRED' | translate }}
    </div>
  </div>

  <div
    class="form-group"
    [ngClass]="{ 'has-error': hasError('description') }"
  >
    <label class="control-label">
      {{ 'RECORDS.ENTER_DESCRIPTION' | translate }}
      <input
        [title]="'RECORDS.ENTER_DESCRIPTION' | translate"
        type="text"
        formControlName="description"
        class="form-control"
      />
    </label>

    <div
      class="form-help-text"
      *ngIf="hasError('description')"
    >
      {{ 'ERRORS.REQUIRED' | translate }}
    </div>
  </div>

  <button
    [title]="'ACTIONS.ADD' | translate"
    type="submit"
    class="btn btn-primary"
    (click)="addEvent()"
    [disabled]="formGroup.invalid"
  >
    {{ 'ACTIONS.ADD' | translate }}
  </button>
</app-card>
