<div>
  <button
    (click)="pageTransition()"
  >
    prev
  </button>
  <input
    type="text"
    [value]="currencyPage"
    (change)="onChange($event.target)"
  >
  <span>
    /
  </span>
  <span>
    {{maxPage}}
  </span>

  <button
    (click)="pageTransition(true)"
  >
    next
  </button>
</div>
<div *ngIf="errorPage">
  Недопустимое значение
</div>
