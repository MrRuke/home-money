<form class="create-category" [formGroup]="formGroup">
  <div class="create-category__field">
    <label for="categoryName">Category name</label>

    <input pInputText id="categoryName" type="text" formControlName="name" />

    <small class="create-category__field-helper">
      Set down category name
    </small>

    <small
      *ngIf="nameControl.hasError('required') && nameControl.dirty"
      class="create-category__field-helper--error"
    >
      Category name is <strong>required</strong>
    </small>

    <small
      *ngIf="nameControl.hasError('maxlength')"
      class="create-category__field-helper--error"
    >
      Category name length is must be <strong>less 32 symbols</strong>
    </small>
  </div>

  <div class="create-category__field">
    <label for="limit">Category limit</label>

    <p-inputNumber
      inputId="integeronly"
      id="limit"
      formControlName="limit"
    ></p-inputNumber>

    <small class="create-category__field-helper"> Set down limit </small>

    <small
      *ngIf="limitControl.hasError('required') && limitControl.dirty"
      class="create-category__field-helper--error"
    >
      Limit is <strong>required</strong>
    </small>

    <small
      *ngIf="limitControl.hasError('min')"
      class="create-category__field-helper--error"
    >
      Limit is must be <strong>more than 0</strong>
    </small>

    <small
      *ngIf="limitControl.hasError('max')"
      class="create-category__field-helper--error"
    >
      Limit is must be <strong>less than 999999</strong>
    </small>
  </div>

  <p-button
    label="Create category"
    severity="success"
    class="create-category__submit-button"
    (onClick)="handleSubmit()"
  ></p-button>
</form>
