<p-progressSpinner *ngIf="isLoading()" ariaLabel="loading" />

<ng-container *ngIf="!isLoading()">
  <div class="records-layout__card">
    <p-card header="{{ 'RECORDS.CREATE_CATEGORY.TITLE' | transloco }}">
      <app-create-category
        (categorySubmitted)="createCategory($event)"
      ></app-create-category>
    </p-card>
  </div>

  <div class="records-layout__card">
    <p-card
      *ngIf="categories() as categories"
      header="{{ 'RECORDS.ADD_HISTORY.TITLE' | transloco }}"
    >
      <app-add-event
        [categories]="categories"
        (eventSubmitted)="addHistoryElement($event)"
      ></app-add-event>
    </p-card>
  </div>
</ng-container>
