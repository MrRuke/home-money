<div class="records-layout__card">
  <p-card header="Create category">
    <app-create-category
      (categorySubmitted)="createCategory($event)"
    ></app-create-category>
  </p-card>
</div>

<div class="records-layout__card">
  <p-card *ngIf="(categories | async) as cats" header="Add event">
    <app-add-event [categories]="cats" (eventSubmitted)="addHistoryElement($event)"></app-add-event>
  </p-card>
</div>
