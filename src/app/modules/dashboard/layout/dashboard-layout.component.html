<div class="app-dashboard-layout">
  <div class="list">
    <div
      *ngFor="let item of accounts | async; trackBy: trackByAccounts"
      class="item"
    >
      {{ item.value | appCost: item.currency }}
    </div>

    <div class="create-card">
      <button mat-fab color="primary">
        <span class="create-card-icon">+</span>
      </button>
    </div>
  </div>
</div>
