<p-table [value]="history">
  <ng-template pTemplate="header">
    <tr>
      <th>No</th>
      <th>Amount</th>
      <th>Date</th>
      <th>Type</th>
    </tr>
  </ng-template>
  
  <ng-template pTemplate="body" let-item>
    <tr>
      <td>{{ item.id }}</td>
      <td>{{ item.amount | appCost : "RUB" }}</td>
      <td>{{ item.date | appMoment : "DD.MM.YYYY HH:mm" }}</td>
      <td>{{ item.type }}</td>
    </tr>
  </ng-template>
</p-table>
