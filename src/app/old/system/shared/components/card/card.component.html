<div class="app-card">
  <div class="card stats">
    <div class="card-header bordered">
      <div class="header-block" style="width: 100%">
        <h4 class="title">
          {{ cardTitle | translate }}
        </h4>

        <div *ngIf="rightHeaderTemplate" class="pull-right">
          <ng-container [ngTemplateOutlet]="rightHeaderTemplate"></ng-container>
        </div>
      </div>
    </div>

    <div class="card-block">
      <ng-content></ng-content>
    </div>
  </div>
</div>
