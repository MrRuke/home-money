<div class="account-cards-wrapper">

    <div class="account-mini-card">
        <div class="mini-card-header">
            <div class="card-title-group">
                <svg class="card-icon teal" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" />
                    <path d="M3 5v14a2 2 0 0 0 2 2h16v-5" />
                    <path d="M18 12a2 2 0 0 0 0 4h4v-4Z" />
                </svg>

                <span class="card-name">Main Checking</span>
            </div>

            <svg lucidePen class="icon-btn edit-btn"></svg>
        </div>
        <div class="mini-card-body">
            <div class="account-balance">€4.235,10</div>
            <div class="account-trend positive">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
                    <polyline points="16 7 22 7 22 13" />
                </svg>
                +2.4%
            </div>
        </div>
    </div>

    <div class="account-mini-card">
        <div class="mini-card-header">
            <div class="card-title-group">
                <svg class="card-icon orange" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="16" height="16" x="4" y="4" rx="2" />
                    <path d="M9 16v-6" />
                    <path d="M15 16v-4" />
                </svg>
                <span class="card-name">Savings</span>
            </div>

            <svg lucidePen class="icon-btn edit-btn"></svg>
        </div>
        <div class="mini-card-body">
            <div class="account-balance">€15.700,50</div>
            <div class="account-trend positive">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
                    <polyline points="16 7 22 7 22 13" />
                </svg>
                +1.1%
            </div>
        </div>
    </div>

    <div class="account-mini-card">
        <div class="mini-card-header">
            <div class="card-title-group">
                <svg class="card-icon red" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="14" x="2" y="5" rx="2" />
                    <line x1="2" x2="22" y1="10" y2="10" />
                </svg>
                <span class="card-name">Credit Card</span>
            </div>

            <svg lucidePen class="icon-btn edit-btn"></svg>
        </div>
        <div class="mini-card-body">
            <div class="account-balance negative">-€845,22</div>
            <div class="account-trend negative">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 17 13.5 8.5 8.5 13.5 2 7" />
                    <polyline points="16 17 22 17 22 11" />
                </svg>
                -5.2%
            </div>
        </div>
    </div>

</div>

<section class="card account-assets">
    <header class="card-header">
        <div class="header-title-group">
            <h2>Total Balance Dynamics</h2>
        </div>

        <div class="time-filters">
            <button [class.active]="activeFilter === '1M'" (click)="setFilter('1M')">1M</button>
            <button [class.active]="activeFilter === '1Y'" (click)="setFilter('1Y')">1Y</button>
            <button [class.active]="activeFilter === '3Y'" (click)="setFilter('3Y')">3Y</button>
        </div>
    </header>

    <div class="card-content">
        <canvas baseChart [data]="balanceChartData" [options]="balanceChartOptions" [type]="'line'">
        </canvas>
    </div>
</section>
