<div class="app-main-menu">
  <div class="list">
    <a
      *ngFor="let item of menuList; trackBy: trackByMenu"
      [routerLink]="item.href"
      [title]="item.title"
    >
      <div class="item" [mod]="{ active: isActive(item.href) }">
        <mat-icon class="icon">{{ item.icon }}</mat-icon>
        <div class="title">{{ item.title }}</div>
      </div>
    </a>
  </div>
</div>
