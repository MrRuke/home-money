<div *ngIf="items.length" class="main-menu">
  <p-menu [model]="items" styleClass="main-menu__container"></p-menu>

  <div class="main-menu__controls">
    <p-dropdown
      [options]="languages"
      [(ngModel)]="selectedLanguage"
      (onChange)="changeLanguage($event)"
      optionLabel="name"
      placeholder="Choose language"
      class="main-menu__dropdown"
    ></p-dropdown>

    <p-dropdown
      [options]="themes"
      [(ngModel)]="selectedTheme"
      (onChange)="changeTheme($event)"
      placeholder="Choose theme"
      class="main-menu__dropdown"
    ></p-dropdown>
  </div>
</div>
